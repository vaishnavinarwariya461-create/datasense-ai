services:
  - type: web
    name: datasense-ai-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        value: https://datasense-ai.vercel.app,http://localhost:5173
      - key: MAX_FILE_SIZE_MB
        value: 50
