services:
  - type: web
    name: datasense-ai
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://datasense-ai-roan.vercel.app,http://localhost:5173
      - key: MAX_FILE_SIZE_MB
        value: 50
